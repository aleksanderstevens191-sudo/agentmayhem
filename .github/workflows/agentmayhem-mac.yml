name: AgentMayhem Mac app

# Builds an unsigned Apple Silicon .dmg on GitHub's free macOS runners.
# Pushes to main replace the download on the "mac-latest" release; other
# branches only upload the .dmg as a run artifact.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: write

concurrency:
  group: agentmayhem-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'aleksanderstevens191-sudo/agentmayhem'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      # Sparse checkout skips the vendored .repos tree and its orphaned gitlinks.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: vp run dist:desktop:dmg:arm64

      - name: Check the app is signed well enough to open
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls release/*.dmg | head -n 1)"
          mount="$RUNNER_TEMP/agentmayhem-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount/AgentMayhem.app"
          hdiutil detach "$mount"
          cp "$dmg" "$RUNNER_TEMP/AgentMayhem-mac-arm64.dmg"

      - name: Upload run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentMayhem-mac-arm64
          path: ${{ runner.temp }}/AgentMayhem-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mac-latest
          notes="Download AgentMayhem-mac-arm64.dmg, open it, and drag AgentMayhem into Applications. The first time, right-click AgentMayhem in Applications and choose Open. Built from ${GITHUB_SHA::7}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "AgentMayhem for Mac" --notes "$notes" --latest
          fi
          gh release upload "$tag" "$RUNNER_TEMP/AgentMayhem-mac-arm64.dmg" --clobber
